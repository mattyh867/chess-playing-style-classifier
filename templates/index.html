<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Playstyle Classifier</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --border: #e3e6ea;
        --text: #14181d;
        --muted: #6b7480;
        --faint: #9aa3ad;
        --accent: #2f6f4f;
        --accent-soft: #e7f1eb;
        --track: #eceef1;
        --bar: #b3bac2;
        --danger: #b3261e;
        --danger-soft: #fdeceb;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.05),
          0 8px 24px -12px rgba(16, 24, 40, 0.14);
        --radius: 14px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1216;
          --surface: #171b21;
          --border: #262c34;
          --text: #e8ecf1;
          --muted: #98a2ae;
          --faint: #6b7480;
          --accent: #5fd39b;
          --accent-soft: #17301f;
          --track: #232931;
          --bar: #47505b;
          --danger: #ff8b82;
          --danger-soft: #2b1715;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.4),
            0 8px 24px -12px rgba(0, 0, 0, 0.6);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter,
          Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 20px 80px;
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      header {
        margin-bottom: 28px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11.5px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
        margin-bottom: 12px;
      }

      .eyebrow .piece {
        font-size: 15px;
        line-height: 1;
      }

      h1 {
        font-size: 30px;
        line-height: 1.15;
        letter-spacing: -0.02em;
        margin: 0 0 8px;
        font-weight: 650;
      }

      .lede {
        margin: 0;
        color: var(--muted);
        max-width: 52ch;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px;
      }

      label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      textarea {
        width: 100%;
        height: 190px;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          monospace;
        font-size: 13px;
        line-height: 1.6;
        padding: 12px 14px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        resize: vertical;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      textarea::placeholder {
        color: var(--faint);
      }

      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .controls {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .controls label {
        margin-bottom: 0;
      }

      select {
        font: inherit;
        font-size: 14px;
        padding: 9px 12px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 9px;
        cursor: pointer;
      }

      select:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button {
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 9px 20px;
        border-radius: 9px;
        border: 1px solid transparent;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        transition: opacity 0.15s ease, transform 0.06s ease;
      }

      @media (prefers-color-scheme: dark) {
        button {
          color: #0f1216;
        }
      }

      button:hover:not(:disabled) {
        opacity: 0.88;
      }

      button:active:not(:disabled) {
        transform: translateY(1px);
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      button.secondary {
        background: transparent;
        color: var(--muted);
        border-color: var(--border);
      }

      #status,
      #error {
        margin-top: 16px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--muted);
      }

      #error {
        color: var(--danger);
        background: var(--danger-soft);
        border-color: transparent;
      }

      .spinner {
        width: 14px;
        height: 14px;
        flex: none;
        border: 2px solid var(--track);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2s;
        }
      }

      #result {
        display: none;
        margin-top: 36px;
      }

      .results-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 12px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border);
      }

      .results-head h2 {
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0;
        font-weight: 600;
      }

      #meta {
        font-size: 13px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }

      .model-block {
        margin-bottom: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px;
      }

      .model-block h3 {
        font-size: 11.5px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--faint);
        font-weight: 600;
        margin: 0 0 10px;
      }

      .model-block h2 {
        text-transform: capitalize;
        margin: 0 0 10px;
        font-size: 22px;
        letter-spacing: -0.015em;
        font-weight: 650;
        display: inline-flex;
        align-items: center;
        gap: 9px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        flex: none;
      }

      .model-block p {
        margin: 0 0 18px;
        line-height: 1.6;
        color: var(--muted);
        font-size: 14px;
        max-width: 58ch;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        font-weight: 600;
        color: var(--faint);
        font-size: 11px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        text-align: left;
        padding: 0 10px 8px 0;
        border-bottom: 1px solid var(--border);
      }

      td {
        text-align: left;
        padding: 11px 10px 11px 0;
        font-size: 14px;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
      }

      tr:last-child td {
        border-bottom: none;
        padding-bottom: 0;
      }

      td:first-child,
      th:first-child {
        width: 108px;
      }

      td:last-child,
      th:last-child {
        text-align: right;
        width: 58px;
        padding-right: 0;
        font-variant-numeric: tabular-nums;
      }

      tr.is-best td {
        color: var(--text);
        font-weight: 600;
      }

      .bar-bg {
        background: var(--track);
        height: 7px;
        width: 100%;
        border-radius: 99px;
        overflow: hidden;
      }

      .bar {
        height: 7px;
        background: var(--bar);
        border-radius: 99px;
        transform-origin: left center;
        animation: grow 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) both;
      }

      .bar.best {
        background: var(--accent);
      }

      @keyframes grow {
        from {
          transform: scaleX(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bar {
          animation: none;
        }
      }

      #reset-btn {
        margin-top: 8px;
      }

      @media (max-width: 520px) {
        body {
          padding: 32px 16px 64px;
        }
        h1 {
          font-size: 25px;
        }
        td:first-child,
        th:first-child {
          width: 84px;
        }
        .controls button {
          margin-left: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="eyebrow"><span class="piece">&#9822;</span> Playstyle analysis</div>
      <h1>Chess Playing Style Classifier</h1>
      <p class="lede">
        Paste a PGN below and select which colour you were playing as.
      </p>
    </header>

    <div class="card">
      <label for="pgn">PGN</label>
      <textarea
        id="pgn"
        placeholder='[Event "Casual Game"]
[White "You"]
[Black "Opponent"]

1. e4 e5 2. Nf3 ...'
      ></textarea>

      <div class="controls">
        <label for="color">Colour</label>
        <select id="color">
          <option value="white">White</option>
          <option value="black">Black</option>
        </select>
        <button onclick="analyse()">Analyse</button>
      </div>

      <div id="status" style="display: none">
        <span class="spinner"></span> Analysing, please wait...
      </div>
      <div id="error" style="display: none"></div>
    </div>

    <div id="result">
      <div class="results-head">
        <h2>Predictions</h2>
        <div id="meta"></div>
      </div>
      <div id="model-blocks"></div>
      <button id="reset-btn" class="secondary" onclick="reset()">
        Try another game
      </button>
    </div>

    <script>
      const ORDER = ["aggressive", "positional", "defensive", "balanced"];
      const MODEL_ORDER = ["Random Forest", "FFNN", "XGBoost"];

      const DESCRIPTIONS = {
        aggressive:
          "Your games tend to be sharp and attacking. You go for early pressure, piece sacrifices, and keeping your opponent on the back foot.",
        positional:
          "You focus more on long-term factors like piece placement and pawn structure rather than going for immediate tactics.",
        defensive:
          "You tend to sit back, neutralise threats, and look to counter rather than attack first.",
        balanced:
          "No strong lean toward any one style. You seem to adjust depending on the position.",
      };

      async function analyse() {
        const pgn = document.getElementById("pgn").value.trim();
        const color = document.getElementById("color").value;

        if (!pgn) {
          showErr("Please paste a PGN first.");
          return;
        }

        setLoading(true);
        hideErr();
        document.getElementById("result").style.display = "none";

        try {
          const res = await fetch("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pgn, color }),
          });
          const data = await res.json();

          if (!res.ok || data.error) {
            showErr(data.error || "Something went wrong.");
            setLoading(false);
            return;
          }

          showResult(data);
        } catch (e) {
          showErr("Could not reach the server.");
        }

        setLoading(false);
      }

      function showResult(data) {
        document.getElementById("meta").textContent =
          data.total_moves + " moves analysed";

        const container = document.getElementById("model-blocks");
        container.innerHTML = "";

        MODEL_ORDER.forEach((modelName, i) => {
          const res = data.results[modelName];
          if (!res) return;

          const highest = Math.max(
            ...ORDER.map((k) => res.probabilities[k] || 0),
          );

          // Built with textContent rather than innerHTML so no server-supplied
          // value is ever parsed as markup.
          const block = document.createElement("div");
          block.className = "model-block";

          const h3 = document.createElement("h3");
          h3.textContent = modelName;

          const h2 = document.createElement("h2");
          const dot = document.createElement("span");
          dot.className = "dot";
          h2.append(dot, document.createTextNode(res.style));

          const desc = document.createElement("p");
          desc.textContent = DESCRIPTIONS[res.style] || "";

          const table = document.createElement("table");
          const thead = document.createElement("thead");
          const headRow = document.createElement("tr");
          ["Style", "Confidence", "%"].forEach((label) => {
            const th = document.createElement("th");
            th.textContent = label;
            headRow.appendChild(th);
          });
          thead.appendChild(headRow);

          const tbody = document.createElement("tbody");
          ORDER.forEach((cls, j) => {
            const pct = res.probabilities[cls] || 0;
            const best = pct === highest;

            const tr = document.createElement("tr");
            if (best) tr.className = "is-best";

            const nameCell = document.createElement("td");
            nameCell.style.textTransform = "capitalize";
            nameCell.textContent = cls;

            const barCell = document.createElement("td");
            const track = document.createElement("div");
            track.className = "bar-bg";
            const fill = document.createElement("div");
            fill.className = best ? "bar best" : "bar";
            fill.style.width = pct + "%";
            fill.style.animationDelay = (i * 0.08 + j * 0.05).toFixed(2) + "s";
            track.appendChild(fill);
            barCell.appendChild(track);

            const pctCell = document.createElement("td");
            pctCell.textContent = pct + "%";

            tr.append(nameCell, barCell, pctCell);
            tbody.appendChild(tr);
          });

          table.append(thead, tbody);
          block.append(h3, h2, desc, table);
          container.appendChild(block);
        });

        document.getElementById("result").style.display = "block";
      }

      function reset() {
        document.getElementById("pgn").value = "";
        document.getElementById("result").style.display = "none";
        hideErr();
        document.getElementById("pgn").focus();
      }

      function setLoading(on) {
        document.getElementById("status").style.display = on ? "flex" : "none";
        document.querySelector(".controls button").disabled = on;
      }

      function showErr(msg) {
        const el = document.getElementById("error");
        el.textContent = msg;
        el.style.display = "flex";
      }

      function hideErr() {
        document.getElementById("error").style.display = "none";
      }
    </script>
  </body>
</html>
